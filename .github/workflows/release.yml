name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run unit tests
        run: dotnet test OllamaRouter.Tests/OllamaRouter.Tests.csproj -c Release

      - name: Publish single file (win-x64)
        run: dotnet publish OllamaRouter/OllamaRouter.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o OllamaRouter-win-x64

      - name: Bundle release artifact
        shell: pwsh
        run: Compress-Archive -Path OllamaRouter-win-x64/* -DestinationPath OllamaRouter-win-x64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: OllamaRouter-win-x64.zip
