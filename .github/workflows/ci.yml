name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test tests/OllamaRouter.Tests/OllamaRouter.Tests.csproj -c Release

  publish:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15-intel
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lldb zlib1g-dev libicu-dev libssl-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libfontconfig1-dev

      - name: Publish Native AOT binaries & stage publish.ps1 layout
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#v}"
          else
            VERSION=$(dotnet msbuild src/OllamaRouter/OllamaRouter.csproj -getProperty:Version 2>/dev/null || true)
            VERSION=${VERSION:-1.0.0}
          fi

          DIST_DIR="dist/OllamaRouter-${RID}"
          mkdir -p "${DIST_DIR}" "${DIST_DIR}/bin" ./artifacts

          for proj in \
            src/OllamaRouter/OllamaRouter.csproj \
            src/OllamaRouter.Cli/OllamaRouter.Cli.csproj \
            src/OllamaRouter.App/OllamaRouter.App.csproj
          do
            dotnet publish "${proj}" \
              -c Release \
              -r "${RID}" \
              -p:PublishAot=true \
              -p:StripSymbols=true \
              -p:DebugType=none \
              -p:DebugSymbols=false \
              -p:Version="${VERSION}" \
              -o "${DIST_DIR}"
          done

          find "${DIST_DIR}" -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete

          printf '%s\n' \
            '{' \
            '  "OllamaRouter": {' \
            '    "StateDirectory": "state"' \
            '  },' \
            '  "Logging": {' \
            '    "LogLevel": {' \
            '      "Default": "Warning",' \
            '      "OllamaRouter": "Information"' \
            '    },' \
            '    "LogsDirectory": "logs"' \
            '  }' \
            '}' \
            > "${DIST_DIR}/appsettings.Production.json"

          if [[ "${RID}" == win-* ]]; then
            printf '@echo off\r\nsetlocal\r\ncd /d "%%~dp0"\r\n"%%~dp0ollamarouter.exe" %%*\r\n' > "${DIST_DIR}/ollamarouter.cmd"
            printf '@echo off\r\nsetlocal\r\ncd /d "%%~dp0.."\r\n"%%~dp0..\\ollamarouter.exe" %%*\r\n' > "${DIST_DIR}/bin/ollamarouter.cmd"
            printf '@echo off\r\nsetlocal\r\ncd /d "%%~dp0.."\r\n"%%~dp0..\\ollamarouter-app.exe" %%*\r\n' > "${DIST_DIR}/bin/ollamarouter-app.cmd"
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"' \
              'cd "$DIR/.."' \
              'if [ -f "$DIR/../ollamarouter.exe" ]; then' \
              '    "$DIR/../ollamarouter.exe" "$@"' \
              'elif [ -f "$DIR/../ollamarouter" ]; then' \
              '    "$DIR/../ollamarouter" "$@"' \
              'fi' \
              > "${DIST_DIR}/bin/ollamarouter"
          else
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"' \
              'cd "$DIR/.."' \
              'exec "$DIR/../ollamarouter" "$@"' \
              > "${DIST_DIR}/bin/ollamarouter"
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"' \
              'cd "$DIR/.."' \
              'exec "$DIR/../ollamarouter-app" "$@"' \
              > "${DIST_DIR}/bin/ollamarouter-app"
            chmod +x \
              "${DIST_DIR}/ollamarouter-server" \
              "${DIST_DIR}/ollamarouter" \
              "${DIST_DIR}/ollamarouter-app" \
              "${DIST_DIR}/bin/ollamarouter" \
              "${DIST_DIR}/bin/ollamarouter-app"
          fi

          printf '%s\n' "${VERSION}" > "${DIST_DIR}/VERSION"
          cp README.md LICENSE "${DIST_DIR}/"

      - name: Archive bundle & SHA256SUMS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "./artifacts/OllamaRouter-$env:RID.zip"
          Compress-Archive -Path "./dist/OllamaRouter-$env:RID/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = [System.IO.Path]::GetFileName($archive)
          [System.IO.File]::WriteAllLines("./artifacts/SHA256SUMS-$env:RID.txt", @("$hash  $name"), [System.Text.UTF8Encoding]::new($false))

      - name: Archive bundle & SHA256SUMS (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          tar -czf "./artifacts/OllamaRouter-${RID}.tar.gz" -C "dist/OllamaRouter-${RID}" .
          (
            cd ./artifacts
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "OllamaRouter-${RID}.tar.gz" > "SHA256SUMS-${RID}.txt"
            else
              shasum -a 256 "OllamaRouter-${RID}.tar.gz" > "SHA256SUMS-${RID}.txt"
            fi
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: OllamaRouter-${{ matrix.rid }}
          path: ./artifacts/*
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Merge unified SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/OllamaRouter-*
            release-artifacts/SHA256SUMS.txt
